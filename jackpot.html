<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jackpot — Toy Asao</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="jackpot.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <div class="nav-avatar"><img src="foto.jpg" alt="Toy Asao"></div>
    <div class="nav-id">
      <span class="n">Toy Asao</span>
      <span class="h">@toyasao7</span>
    </div>
  </div>
  <div class="nav-links">
    <a href="index.html">Inicio</a>
  </div>
  <a class="nav-contact" href="https://www.instagram.com/toy.asao.yt" target="_blank" rel="noopener">Contacto</a>
</nav>

<main class="wrap">

  <section class="jp-hero">
    <h1 class="jp-title">Jackpot</h1>
    <p class="jp-subtitle">Ingresa tu ID y gira la palanca</p>
  </section>

  <!-- ══════════════════════════════════════
       GATE — pide el ID antes de poder jugar
       ══════════════════════════════════════ -->
  <section class="id-gate" id="id-gate">
    <label class="id-label" for="player-id">Tu ID (mínimo 8 dígitos)</label>
    <input
      class="id-input"
      type="text"
      id="player-id"
      inputmode="numeric"
      autocomplete="off"
      placeholder="Ej: 12345678"
      minlength="8"
      pattern="[0-9]{8,}"
      required>
    <p class="id-error" id="id-error"></p>
  </section>

  <!-- ══════════════════════════════════════
       MÁQUINA — 5 carretes + palanca
       Bloqueada hasta que el ID sea válido
       ══════════════════════════════════════ -->
  <section class="machine" id="machine">

    <div class="reels" id="reels">
      <div class="reel-window"><div class="reel-symbol" data-reel="0">🍒</div></div>
      <div class="reel-window"><div class="reel-symbol" data-reel="1">🍋</div></div>
      <div class="reel-window"><div class="reel-symbol" data-reel="2">🔔</div></div>
      <div class="reel-window"><div class="reel-symbol" data-reel="3">💎</div></div>
      <div class="reel-window"><div class="reel-symbol" data-reel="4">7️⃣</div></div>
    </div>

    <button class="spin-btn" id="spin-btn" disabled>
      Girar
    </button>

    <p class="lock-msg" id="lock-msg">Ingresa un ID válido para desbloquear la palanca</p>

    <p class="result-msg" id="result-msg"></p>

  </section>

</main>

<script src="jackpot.js"></script>
</body>
</html>
