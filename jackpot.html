<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jackpot — Toy Asao</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="jackpot.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <div class="nav-avatar"><img src="foto.jpg" alt="Toy Asao"></div>
    <div class="nav-id">
      <span class="n">Toy Asao</span>
      <span class="h">@toyasao7</span>
    </div>
  </div>
  <div class="nav-links">
    <a href="index.html">Inicio</a>
  </div>
  <a class="nav-contact" href="https://www.instagram.com/toy.asao.yt" target="_blank" rel="noopener">Contacto</a>
</nav>

<main class="wrap">

  <section class="jp-hero">
    <h1 class="jp-title">Jackpot</h1>
    <p class="jp-subtitle">Ingresa tu ID y gira la palanca</p>
  </section>

  <!-- ══════════════════════════════════════
       GATE — pide el ID antes de poder jugar
       ══════════════════════════════════════ -->
  <section class="id-gate" id="id-gate">
    <label class="id-label" for="player-id">Tu ID (mínimo 8 dígitos)</label>
    <input
      class="id-input"
      type="text"
      id="player-id"
      inputmode="numeric"
      autocomplete="off"
      placeholder="Ej: 12345678"
      minlength="8"
      pattern="[0-9]{8,}"
      required>
    <p class="id-error" id="id-error"></p>
  </section>

  <!-- ══════════════════════════════════════
       GABINETE — pantalla + 5 carretes + palanca
       Bloqueado hasta que el ID sea válido
       ══════════════════════════════════════ -->
  <section class="cabinet" id="machine">

    <div class="coins" aria-hidden="true">
      <span class="coin" style="top:-6%; left:8%; width:20px; height:20px;"></span>
      <span class="coin" style="top:-10%; left:32%; width:16px; height:16px;"></span>
      <span class="coin" style="top:-4%; left:60%; width:22px; height:22px;"></span>
      <span class="coin" style="top:8%; left:-6%; width:18px; height:18px;"></span>
      <span class="coin" style="top:55%; left:-8%; width:20px; height:20px;"></span>
      <span class="coin" style="bottom:-6%; left:20%; width:18px; height:18px;"></span>
      <span class="coin" style="bottom:-8%; left:55%; width:22px; height:22px;"></span>
    </div>

    <div class="cabinet-body">

      <div class="screen">
        <span class="screen-title">Jackpot</span>
      </div>

      <div class="reels-frame">
        <div class="reels" id="reels">
          <div class="reel-window"><img class="reel-symbol" data-reel="0" src="diamantes.jpg" alt=""></div>
          <div class="reel-window"><img class="reel-symbol" data-reel="1" src="fragmento_evo.jpg" alt=""></div>
          <div class="reel-window"><img class="reel-symbol" data-reel="2" src="booyah_pass.jpg" alt=""></div>
          <div class="reel-window"><img class="reel-symbol" data-reel="3" src="sakura.jpg" alt=""></div>
          <div class="reel-window"><img class="reel-symbol" data-reel="4" src="sigue_intentando.jpg" alt=""></div>
        </div>
      </div>

      <div class="plate">
        <span class="plate-text">Toy Asao</span>
      </div>

    </div>

    <button class="lever-btn" id="spin-btn" disabled aria-label="Girar la palanca">
      <span class="lever-track"></span>
      <span class="lever-knob"></span>
    </button>

  </section>

  <p class="lock-msg" id="lock-msg">Ingresa un ID válido para desbloquear la palanca</p>

  <p class="result-msg" id="result-msg"></p>

</main>

<script src="jackpot.js"></script>
</body>
</html>
